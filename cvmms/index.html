<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172a">
  <title>Jogo da Memória</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10172a;
      color: #f4f6ff;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 15% 10%, #26365c 0, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #382950 0, transparent 35%),
        #10172a;
    }

    .game {
      width: min(100%, 620px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #aab7e8;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      letter-spacing: -0.06em;
    }

    .subtitle {
      margin: 10px 0 24px;
      color: #b8c0d9;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stat {
      min-width: 92px;
      padding: 10px 14px;
      border: 1px solid #34405e;
      border-radius: 14px;
      background: #1a2339cc;
      text-align: left;
    }

    .stat-label {
      display: block;
      margin-bottom: 2px;
      color: #aab7e8;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stat strong {
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
    }

    .difficulty {
      display: grid;
      gap: 4px;
      text-align: left;
    }

    .difficulty label {
      color: #aab7e8;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .difficulty select {
      min-height: 42px;
      border: 1px solid #465579;
      border-radius: 12px;
      padding: 0 10px;
      background: #1a2339;
      color: #f4f6ff;
      font: inherit;
      cursor: pointer;
    }

    .restart {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: #8b7bff;
      color: #101225;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    .restart:hover {
      transform: translateY(-2px);
      background: #a398ff;
    }

    .restart:focus-visible,
    .difficulty select:focus-visible,
    .card:focus-visible {
      outline: 3px solid #ffe28a;
      outline-offset: 3px;
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 0 16px;
      color: #c4cbed;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .progress strong {
      color: #f4f6ff;
    }

    .progress-separator {
      color: #6f7b9d;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
      border: 1px solid #34405e;
      border-radius: 22px;
      background: #182138cc;
      box-shadow: 0 24px 70px #05091466;
    }

    .card {
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      perspective: 700px;
    }

    .card-inner {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      transform-style: preserve-3d;
      transition: transform 360ms cubic-bezier(.2, .75, .25, 1);
    }

    .card.is-open .card-inner,
    .card.is-matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 1px solid #465579;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      background: linear-gradient(145deg, #283858, #202b46);
      color: #a8b8e8;
      font-size: clamp(1.5rem, 7vw, 2.2rem);
      transition: background 160ms ease, border-color 160ms ease;
    }

    .card:not(.is-open):not(.is-matched):hover .card-back {
      border-color: #9b8dff;
      background: #33466d;
    }

    .card-front {
      transform: rotateY(180deg);
      background: #f1edff;
      color: #20243b;
      font-size: clamp(2rem, 10vw, 3rem);
    }

    .card.is-matched .card-front {
      border-color: #7ddcb1;
      background: #dff9ed;
    }

    .card:disabled {
      cursor: default;
    }

    .message {
      min-height: 28px;
      margin: 18px 0 0;
      color: #c4cbed;
      font-weight: 600;
    }

    .message.won {
      color: #9af0c5;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 520px) {
      .toolbar {
        justify-content: center;
      }

      .stats {
        justify-content: center;
        width: 100%;
      }

      .difficulty,
      .restart {
        flex: 1;
      }
    }

    @media (max-width: 420px) {
      .board {
        gap: 8px;
        padding: 10px;
      }

      .card {
        border-radius: 12px;
      }

      .stat {
        min-width: 76px;
        padding: 9px 10px;
      }

      .restart {
        padding: 11px 12px;
      }

      .progress {
        font-size: 0.88rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="eyebrow">Desafio rápido</p>
    <h1>Jogo da Memória</h1>
    <p class="subtitle">Encontre todos os pares de emojis!</p>

    <section class="toolbar" aria-label="Placar">
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Jogadas</span>
          <strong id="moves">0</strong>
        </div>

        <div class="stat">
          <span class="stat-label">Tempo</span>
          <strong id="timer">00:00</strong>
        </div>
      </div>

      <div class="difficulty">
        <label for="difficulty">Quantidade</label>
        <select id="difficulty">
          <option value="4">8 cartas — Fácil</option>
          <option value="6">12 cartas — Médio</option>
          <option value="8" selected>16 cartas — Difícil</option>
          <option value="10">20 cartas — Desafio</option>
        </select>
      </div>

      <button class="restart" id="restart" type="button">
        Recomeçar
      </button>
    </section>

    <p class="progress" aria-live="polite">
      <span>Pares encontrados: <strong id="matches">0</strong></span>
      <span class="progress-separator">•</span>
      <span>Pares restantes: <strong id="remaining">0</strong></span>
    </p>

    <section class="board" id="board" aria-label="Cartas do jogo"></section>

    <p class="message" id="message" role="status" aria-live="polite">
      Vire duas cartas para começar.
    </p>

    <p class="sr-only" id="instructions">
      Use Tab para escolher uma carta e Enter ou Espaço para virá-la.
    </p>
  </main>

  <script>
    const symbols = ["🍓", "🚀", "🐙", "🌈", "🎸", "🦊", "🍩", "🌻", "🐸", "⚽"];
    const board = document.querySelector("#board");
    const movesDisplay = document.querySelector("#moves");
    const timerDisplay = document.querySelector("#timer");
    const matchesDisplay = document.querySelector("#matches");
    const remainingDisplay = document.querySelector("#remaining");
    const message = document.querySelector("#message");
    const restartButton = document.querySelector("#restart");
    const difficultySelect = document.querySelector("#difficulty");

    let firstCard = null;
    let secondCard = null;
    let locked = false;
    let moves = 0;
    let matches = 0;
    let seconds = 0;
    let timer = null;
    let mismatchTimeout = null;
    let currentPairCount = Number(difficultySelect.value);

    function shuffle(items) {
      const shuffled = [...items];

      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));

        [shuffled[index], shuffled[randomIndex]] = [
          shuffled[randomIndex],
          shuffled[index]
        ];
      }

      return shuffled;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60)
        .toString()
        .padStart(2, "0");

      const remainder = (totalSeconds % 60)
        .toString()
        .padStart(2, "0");

      return `${minutes}:${remainder}`;
    }

    function updateProgress() {
      const remaining = currentPairCount - matches;

      matchesDisplay.textContent = matches;
      remainingDisplay.textContent = remaining;
    }

    function startTimer() {
      if (timer !== null) return;

      timer = window.setInterval(() => {
        seconds += 1;
        timerDisplay.textContent = formatTime(seconds);
      }, 1000);
    }

    function createCard(symbol, index) {
      const card = document.createElement("button");

      card.className = "card";
      card.type = "button";
      card.dataset.symbol = symbol;
      card.dataset.index = index + 1;

      card.setAttribute(
        "aria-label",
        `Carta ${index + 1}, virada para baixo`
      );

      card.setAttribute("aria-describedby", "instructions");

      card.innerHTML = `
        <span class="card-inner" aria-hidden="true">
          <span class="card-face card-back">?</span>
          <span class="card-face card-front">${symbol}</span>
        </span>
      `;

      card.addEventListener("click", () => flipCard(card));

      return card;
    }

    function flipCard(card) {
      if (
        locked ||
        card === firstCard ||
        card.classList.contains("is-matched")
      ) {
        return;
      }

      startTimer();

      card.classList.add("is-open");
      card.setAttribute("aria-label", `Carta: ${card.dataset.symbol}`);

      if (firstCard === null) {
        firstCard = card;
        return;
      }

      secondCard = card;
      locked = true;

      moves += 1;
      movesDisplay.textContent = moves;

      if (firstCard.dataset.symbol === secondCard.dataset.symbol) {
        firstCard.classList.add("is-matched");
        secondCard.classList.add("is-matched");

        firstCard.disabled = true;
        secondCard.disabled = true;

        firstCard.setAttribute(
          "aria-label",
          `Par encontrado: ${firstCard.dataset.symbol}`
        );

        secondCard.setAttribute(
          "aria-label",
          `Par encontrado: ${secondCard.dataset.symbol}`
        );

        matches += 1;
        updateProgress();
        resetTurn();

        if (matches === currentPairCount) {
          window.clearInterval(timer);
          timer = null;

          message.textContent =
            `Parabéns! Você encontrou todos os ${matches} pares ` +
            `em ${moves} jogadas e ${formatTime(seconds)}.`;

          message.classList.add("won");
        } else {
          message.textContent =
            `Boa! Você encontrou um par. ` +
            `Faltam ${currentPairCount - matches} pares.`;

          locked = false;
        }

        return;
      }

      message.textContent = "Não foi dessa vez. Tente novamente!";

      const cardsToClose = [firstCard, secondCard];

      mismatchTimeout = window.setTimeout(() => {
        cardsToClose.forEach((openCard) => {
          openCard.classList.remove("is-open");

          openCard.setAttribute(
            "aria-label",
            `Carta ${openCard.dataset.index}, virada para baixo`
          );
        });

        resetTurn();
        locked = false;
        mismatchTimeout = null;
      }, 850);
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
    }

    function newGame() {
      if (timer !== null) {
        window.clearInterval(timer);
      }

      if (mismatchTimeout !== null) {
        window.clearTimeout(mismatchTimeout);
      }

      mismatchTimeout = null;
      firstCard = null;
      secondCard = null;
      locked = false;
      moves = 0;
      matches = 0;
      seconds = 0;
      timer = null;

      movesDisplay.textContent = "0";
      timerDisplay.textContent = "00:00";

      message.textContent = "Vire duas cartas para começar.";
      message.classList.remove("won");
      currentPairCount = Number(difficultySelect.value);
      const gameSymbols = symbols.slice(0, currentPairCount);
      board.replaceChildren(...shuffle([...gameSymbols, ...gameSymbols]).map(createCard));
    }

    restartButton.addEventListener("click", newGame);
    difficultySelect.addEventListener("change", newGame);
    newGame();
  </script>
</body>
</html>
